<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELBOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&display=swap">
<style>
  /* Ink rules, a condensed display title, condensed numerals, one accent colour for the dates. */
  :root {
    --paper: #F4F4F1; --ink: #121212; --muted: #66665F; --rule: #D3D3CC; --accent: #1F3BD6;
    --display: "Karantina", "IBM Plex Sans Hebrew", "Arial Hebrew", sans-serif;
    --nums: "Barlow Condensed", "Arial Narrow", sans-serif;
    --text: "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--text); accent-color: var(--ink);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--ink); color: var(--paper); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, p, fieldset, legend { margin: 0; padding: 0; }
  fieldset { border: 0; min-width: 0; }
  button, input { font: inherit; color: inherit; }

  main { max-width: 600px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font: 700 64px/.74 var(--display); padding: .24em 0 .16em; border-bottom: 3px solid var(--ink); text-align: center; }

  /* first the date, then what it is; the list appears only after one of the three is pressed */
  .ask { display: grid; gap: 16px; margin-top: 24px; }
  .ask > label { justify-self: start; }
  .lab { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  #date { height: 44px; padding: 0 10px; background: transparent; border: 1px solid var(--ink); border-radius: 0;
    font: 600 20px/1 var(--nums); font-variant-numeric: tabular-nums; transition: background-color 150ms var(--ease-out); }
  .seg { display: flex; height: 44px; border: 1px solid var(--ink); }
  .seg label { position: relative; display: flex; flex: 1; cursor: pointer; }
  .seg label + label { border-inline-start: 1px solid var(--ink); }
  .seg input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .seg span { display: flex; flex: 1; align-items: center; justify-content: center; padding: 0 10px; font-size: 15px; white-space: nowrap; user-select: none;
    transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out), transform 120ms var(--ease-out); }
  .seg label:active span { transform: scale(0.97); }
  .seg input:checked + span { background: var(--ink); color: var(--paper); font-weight: 500; }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* until there is a date */
  fieldset:disabled .seg, fieldset:disabled .seg label { border-color: var(--rule); cursor: default; }
  fieldset:disabled .seg input { cursor: default; }
  fieldset:disabled .seg span { color: var(--muted); transform: none; }

  section { margin-top: 32px; }
  .hd { display: flex; align-items: baseline; gap: 14px; }
  h2 { font: 700 28px/.9 var(--display); }
  .hd p { color: var(--muted); font-size: 14px; }
  h2, .d { color: var(--accent); }

  .row { display: grid; grid-template-columns: 120px 1fr; column-gap: 20px; padding: 14px 0; border-top: 1px solid var(--rule); }
  .hd + .row { border-top: 1px solid var(--ink); margin-top: 6px; }
  .d { font: 600 24px/1 var(--nums); font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
  .w { margin-top: 3px; font-size: 13px; color: var(--muted); }
  h3 { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; font-weight: 700; }
  h3 span, .sub .r { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .row p { font-size: 15px; }
  .note { color: var(--muted); font-size: 13px; }
  /* a step counted from the row above it */
  /* steps counted from the row above them: set in from the edge on a hairline, smaller, lighter, in ink */
  .subs { grid-column: 1 / -1; display: grid; row-gap: 10px; margin-top: 12px; margin-inline-start: 5px; padding-inline-start: 14px;
    border-inline-start: 1px solid var(--muted); }
  .sub { display: grid; grid-template-columns: 100px 1fr; column-gap: 20px; }
  .sub .d { font-size: 18px; color: var(--ink); }
  .sub .t { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }

  .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 32px; padding-top: 10px;
    border-top: 3px solid var(--ink); font-size: 13px; color: var(--muted); }
  .acts { display: flex; gap: 18px; white-space: nowrap; }
  /* the padding and negative margin enlarge the tap area without moving the text */
  .acts button { background: none; border: 0; padding: 10px 0; margin: -10px 0; font-weight: 700; color: var(--ink); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; transition: transform 120ms var(--ease-out); }
  .acts button:active { transform: scale(0.97); }
  #copy { min-width: 3.5em; text-align: start; } /* "הועתק" is narrower than "העתקה"; keep the next button in place */

  /* switching the kind of date by pointer: the new list settles in; a keyboard switch or a date change is instant */
  #result.swap section, #result.swap .bar { transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
  #result.swap section + section { transition-delay: 40ms; }
  @starting-style { #result.swap section, #result.swap .bar { opacity: 0; transform: translateY(6px); } }

  @media (hover: hover) and (pointer: fine) {
    fieldset:enabled .seg label:hover span { background: var(--rule); }
    fieldset:enabled .seg input:checked + span { background: var(--ink); }
    #date:hover { background: rgb(18 18 18 / 0.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .seg label:active span, .acts button:active { transform: none; }
    #result.swap section, #result.swap .bar { transition: none; }
  }
  .error { margin-top: 28px; padding-top: 10px; border-top: 3px solid var(--ink); font-weight: 700; }

  @media (max-width: 640px) {
    main { padding: 20px 16px 40px; }
    h1 { font-size: 56px; }
    .ask > label, #date { width: 100%; }
    .seg span { padding: 0 4px; font-size: 14px; white-space: normal; text-align: center; line-height: 1.15; }
    .row { grid-template-columns: 100px 1fr; column-gap: 12px; }
    .sub { grid-template-columns: 80px 1fr; column-gap: 12px; }
    .bar { flex-direction: column; gap: 14px; }
  }
  @media print { .ask, .acts { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<main>
  <h1>ELBOT</h1>

  <form class="ask" onsubmit="return false">
    <label><span class="lab">תאריך</span><input type="date" id="date" min="2021-01-01"></label>
    <fieldset id="kind" disabled>
      <legend class="lab">מה התאריך</legend>
      <div class="seg" id="anchors"></div>
    </fieldset>
  </form>

  <div id="result" aria-live="polite"></div>
</main>

<script src="calendar.js"></script>
<script src="engine.js"></script>
<script src="rules.js"></script>
<script>
  const WEEKDAYS = ["יום א׳", "יום ב׳", "יום ג׳", "יום ד׳", "יום ה׳", "יום ו׳", "שבת"];
  // The sections shown for each kind of date, and their headings.
  const SECTIONS = { claim: ["claim", "last"], last: ["last"], pretrial: ["pretrial"] };
  const HEADINGS = { claim: ["כתבי טענות", "מהמצאת כתב התביעה"], last: ["קדימה", "מכתב הטענות האחרון"],
    pretrial: ["אחורה", "מקדם המשפט הראשון"] };
  const anchorIds = new Set(ANCHORS.map((a) => a.id));
  const el = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function dmy(o) {
    const d = Moadim.toDate(o);
    return d.getUTCDate() + "." + (d.getUTCMonth() + 1) + "." + d.getUTCFullYear();
  }
  const dayName = (o) => WEEKDAYS[Moadim.weekday(o)];
  const days = (r) => `${Math.abs(r.days)} יום`;

  let anchor = null; // which of the three kinds of date was pressed; none until one is
  let shown = null; // what is on the page now: { label, start, rows }
  el("anchors").innerHTML = ANCHORS.map((a) =>
    `<label><input type="radio" name="anchor" value="${a.id}"><span>${a.label}</span></label>`).join("");
  let byPointer = false;
  el("anchors").addEventListener("pointerdown", () => { byPointer = true; });
  el("anchors").addEventListener("change", (e) => {
    anchor = e.target.value;
    el("result").classList.toggle("swap", byPointer);
    byPointer = false;
    render();
  });
  // a new date clears the list; it comes back when one of the three is pressed again
  el("date").addEventListener("change", () => {
    el("kind").disabled = !el("date").value;
    for (const radio of document.querySelectorAll("[name=anchor]")) radio.checked = false;
    anchor = null;
    el("result").innerHTML = "";
  });
  el("result").addEventListener("click", (e) => {
    if (e.target.id === "copy") {
      const text = [`מועדים לפי ${shown.label}, ${dmy(shown.start)}:`]
        .concat(shown.rows.map((r) => `${dmy(r.date)} (${dayName(r.date)}) – ${r.action} (תקנה ${r.reg})`)).join("\n");
      navigator.clipboard.writeText(text).then(() => {
        e.target.textContent = "הועתק";
        setTimeout(() => { e.target.textContent = "העתקה"; }, 1400);
      });
    } else if (e.target.id === "csv") {
      download(`מועדים ${dmy(shown.start)}.csv`, csv(shown));
    }
  });

  // Why the date is not simply the start plus the days.
  function noteText(r) {
    const parts = Object.keys(r.skipped).map((name) => `${name} לא נספרה`);
    if (r.movedFrom) parts.push(`${r.days < 0 ? "הוקדם" : "נדחה"} מ-${dmy(r.movedFrom)} (${r.reasons[0]})`);
    return parts.join(" · ");
  }
  const note = (r) => (noteText(r) ? `<p class="note">${noteText(r)}</p>` : "");

  // The rows as a CSV file that Excel opens in Hebrew (UTF-8 with a byte order mark).
  function csv({ label, start, rows }) {
    const nameOf = (id) => (ANCHORS.find((a) => a.id === id) || RULES.find((r) => r.id === id));
    const date = (o) => Moadim.toIso(o).split("-").reverse().join("/");
    const lines = [["תאריך אחרון", "יום", "פעולה", "תקנה", "ימים", "נספר", "הערה"],
      [date(start), dayName(start), label, "", "", "", ""]];
    for (const r of rows) {
      const from = nameOf(r.from);
      lines.push([date(r.date), dayName(r.date), r.action, r.reg, Math.abs(r.days),
        `${r.days < 0 ? "לפני" : "אחרי"} ${from.label || from.action}`, noteText(r)]);
    }
    return "\uFEFF" + lines.map((l) => l.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n") + "\r\n";
  }
  function download(name, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function render() {
    const start = Moadim.fromIso(el("date").value);
    let rows;
    try {
      rows = schedule(anchor, start);
    } catch (err) {
      el("result").innerHTML = `<p class="error">${esc(err.message)}</p>`;
      return;
    }
    const dateOf = { [anchor]: start };
    for (const r of rows) dateOf[r.id] = r.date;
    // the steps counted from a row, and from those steps, in order
    const under = (id) => rows.filter((r) => r.from === id && !anchorIds.has(r.id)).flatMap((r) => [r, ...under(r.id)]);
    // the rows of a section: counted from its date, plus a step that is itself the next section's date
    const tops = (id) => rows.filter((r) => r.from === id).flatMap((r) => [r, ...rows.filter((c) => c.from === r.id && anchorIds.has(c.id))]);

    const subs = (list) => (list.length ? `<div class="subs">${list.map((s) => `
            <div class="sub">
              <div><div class="d">${dmy(s.date)}</div><div class="w">${dayName(s.date)} · ${days(s)}</div></div>
              <div><div class="t"><span>${esc(s.action)}</span><span class="r">${esc(s.reg)}</span></div>${note(s)}</div>
            </div>`).join("")}</div>` : "");

    const html = SECTIONS[anchor].map((id) => {
      const [title, from] = HEADINGS[id];
      return `
      <section>
        <div class="hd"><h2>${title}</h2><p>${from}, ${dayName(dateOf[id])} ${dmy(dateOf[id])}</p></div>
        ${tops(id).map((r) => `
        <div class="row">
          <div><div class="d">${dmy(r.date)}</div><div class="w">${dayName(r.date)} · ${days(r)}</div></div>
          <div><h3>${esc(r.action)}<span>${esc(r.reg)}</span></h3>${note(r)}</div>
          ${subs(anchorIds.has(r.id) ? [] : under(r.id))}
        </div>`).join("")}
      </section>`;
    }).join("");

    shown = { label: ANCHORS.find((a) => a.id === anchor).label, start, rows };
    el("result").innerHTML = html + `
      <div class="bar"><div><p>קודם כל, תרגעי. הפגרה אינה נספרת (179(ב)). מועד שקבע בית המשפט גובר.</p>
        <p>לא מומלץ להשתמש. לא מומלץ להסתמך. עדיף לשאול את פאר.</p></div>
      <span class="acts"><button type="button" id="copy">העתקה</button><button type="button" id="csv">הורדת CSV</button></span></div>`;
  }
</script>
</body>
</html>
